<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2027 비전 트립 Go Sapporo 계산기</title>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 15px 10px; color: #333; }
    .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 20px 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; color: #1e3a8a; text-align: center; margin-top: 5px; margin-bottom: 5px; }
    .subtitle { font-size: 13px; text-align: center; color: #666; margin-bottom: 15px; }
    .info-box { background: #eff6ff; border-left: 4px solid #3b82f6; padding: 10px 14px; border-radius: 4px; font-size: 12px; margin-bottom: 15px; line-height: 1.5; }
    
    /* 상단 점수 입력 섹션 */
    .target-section { 
      display: flex; 
      gap: 30px; 
      background: #f8fafc; 
      padding: 15px; 
      border-radius: 8px; 
      margin-bottom: 15px; 
      justify-content: center; 
      align-items: center; 
      flex-wrap: wrap; 
    }
    .input-group { display: flex; align-items: center; gap: 6px; }
    .input-group label { font-size: 13px; font-weight: bold; color: #1e293b; white-space: nowrap; }
    .input-group input { width: 100px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; text-align: right; }
    .unit-text { font-size: 13px; color: #475569; font-weight: 500; white-space: nowrap; }

    /* 테이블 영역 (모바일 터치 스크롤 지원) */
    .table-container { 
      overflow-x: auto; 
      margin-bottom: 15px; 
      -webkit-overflow-scrolling: touch; 
      border: 1px solid #e2e8f0; 
      border-radius: 6px; 
    }
    table { width: 100%; border-collapse: collapse; min-width: 850px; font-size: 13px; }
    th, td { border: 1px solid #e2e8f0; padding: 8px 4px; text-align: center; }
    th { background: #f1f5f9; color: #334155; font-weight: 600; }
    
    /* PV 입력 칸 */
    .pv-input {
      width: 98%;
      padding: 6px 4px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      text-align: right;
      font-size: 13px;
    }

    /* FQ 입력 칸 */
    .fq-input {
      width: 90%;
      padding: 5px 2px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      text-align: center;
      font-size: 13px;
    }

    /* 하단 결과 섹션 */
    .result-section { 
      background: #e2e8f0; 
      padding: 12px 15px; 
      border-radius: 8px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 10px; 
      flex-wrap: wrap; 
    }
    .result-item { 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      gap: 8px; 
      background: #fff; 
      padding: 8px 12px; 
      border-radius: 6px; 
      border: 1px solid #cbd5e1; 
      flex: 1;
      min-width: 180px;
    }
    .result-title { font-size: 12px; font-weight: bold; color: #334155; white-space: nowrap; }
    .result-val { color: #2563eb; font-size: 15px; font-weight: bold; white-space: nowrap; }
    .reset-btn { 
      background: #64748b; 
      color: white; 
      border: none; 
      padding: 9px 16px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 12px; 
      white-space: nowrap; 
    }
    .reset-btn:hover { background: #475569; }

    /* ==========================================
       모바일 화면 전용 스타일 (@media)
    ========================================== */
    @media (max-width: 768px) {
      .container { padding: 15px 10px; }
      h1 { font-size: 18px; }
      
      /* 상단 입력칸 모바일 정렬 */
      .target-section { 
        flex-direction: column; 
        gap: 12px; 
        align-items: stretch; 
        padding: 12px; 
      }
      .input-group { 
        justify-content: space-between; 
        width: 100%; 
      }
      .input-group input { width: 110px; }

      /* 하단 결과 영역 세로 정렬 */
      .result-section { 
        flex-direction: column; 
        align-items: stretch; 
        gap: 8px; 
      }
      .result-item { 
        width: 100%; 
      }
      .reset-btn { 
        width: 100%; 
        margin-top: 4px; 
        padding: 10px; 
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>2027 비전 트립 Go Sapporo 도전 계산기</h1>
  <div class="subtitle">PF27 비전트립점수 목표 및 달성 계산</div>

  <div class="info-box">
    <strong>◆ 비전트립점수 공식:</strong> 개인 그룹 PV + (FQ × 1,000만 점)<br>
    ※ 숫자 입력 시 천 단위 콤마가 자동 반영되며 즉시 계산됩니다.
  </div>

  <!-- 상단 점수 입력 영역 -->
  <div class="target-section">
    <div class="input-group">
      <label for="baseScore">기준 년도 비전트립점수:</label>

      <div>
        <input type="text" id="baseScore" class="formatted-number" placeholder="0" oninput="handleFormattedInput(this)">
        <span class="unit-text">만 점</span>
      </div>
    </div>
    <div class="input-group">
      <label for="targetScore">목표 비전트립점수:</label>
      <div>
        <input type="text" id="targetScore" class="formatted-number" placeholder="0" oninput="handleFormattedInput(this)">
        <span class="unit-text">만 점</span>
      </div>
    </div>
  </div>

  <!-- 월별 입력 테이블 (터치 스크롤) -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 150px;">구분</th>
          <th>26/9</th><th>26/10</th><th>26/11</th><th>26/12</th>
          <th>27/1</th><th>27/2</th><th>27/3</th><th>27/4</th>
          <th>27/5</th><th>27/6</th><th>27/7</th><th>27/8</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><strong>개인 그룹 PV (만점)</strong></td>
          <td><input type="text" class="pv pv-input formatted-number" oninput="handleFormattedInput(this)"></td>
          <td><input type="text" class="pv pv-input formatted-number" oninput="handleFormattedInput(this)"></td>
          <td><input type="text" class="pv pv-input formatted-number" oninput="handleFormattedInput(this)"></td>
          <td><input type="text" class="pv pv-input formatted-number" oninput="handleFormattedInput(this)"></td>
          <td><input type="text" class="pv pv-input formatted-number" oninput="handleFormattedInput(this)"></td>
          <td><input type="text" class="pv pv-input formatted-number" oninput="handleFormattedInput(this)"></td>
          <td><input type="text" class="pv pv-input formatted-number" oninput="handleFormattedInput(this)"></td>
          <td><input type="text" class="pv pv-input formatted-number" oninput="handleFormattedInput(this)"></td>
          <td><input type="text" class="pv pv-input formatted-number" oninput="handleFormattedInput(this)"></td>
          <td><input type="text" class="pv pv-input formatted-number" oninput="handleFormattedInput(this)"></td>
          <td><input type="text" class="pv pv-input formatted-number" oninput="handleFormattedInput(this)"></td>
          <td><input type="text" class="pv pv-input formatted-number" oninput="handleFormattedInput(this)"></td>
        </tr>
        <tr>
          <td><strong>독립다운 라인 FQ 수</strong></td>
          <td><input type="number" class="fq fq-input" min="0" max="10" oninput="calculate()"></td>
          <td><input type="number" class="fq fq-input" min="0" max="10" oninput="calculate()"></td>
          <td><input type="number" class="fq fq-input" min="0" max="10" oninput="calculate()"></td>
          <td><input type="number" class="fq fq-input" min="0" max="10" oninput="calculate()"></td>
          <td><input type="number" class="fq fq-input" min="0" max="10" oninput="calculate()"></td>
          <td><input type="number" class="fq fq-input" min="0" max="10" oninput="calculate()"></td>
          <td><input type="number" class="fq fq-input" min="0" max="10" oninput="calculate()"></td>
          <td><input type="number" class="fq fq-input" min="0" max="10" oninput="calculate()"></td>
          <td><input type="number" class="fq fq-input" min="0" max="10" oninput="calculate()"></td>
          <td><input type="number" class="fq fq-input" min="0" max="10" oninput="calculate()"></td>
          <td><input type="number" class="fq fq-input" min="0" max="10" oninput="calculate()"></td>
          <td><input type="number" class="fq fq-input" min="0" max="10" oninput="calculate()"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 하단 결과 표시 영역 -->
  <div class="result-section">
    <div class="result-item">
      <span class="result-title">현재까지 달성:</span>
      <span class="result-val"><span id="currentScore">0</span> 만 점</span>
    </div>
    <div class="result-item">
      <span class="result-title">남은 개월수:</span>
      <span class="result-val"><span id="remMonths">12</span> 개월</span>
    </div>
    <div class="result-item">
      <span class="result-title">매달 달성 필요 PV:</span>
      <span class="result-val"><span id="reqMonthlyPv">0</span> 만 PV/월</span>
    </div>
    <button class="reset-btn" onclick="resetForm()">입력 초기화</button>
  </div>
</div>

<script>
  function parseRawNumber(value) {
    if (!value) return 0;
    const cleanStr = value.toString().replace(/,/g, '');
    const num = parseFloat(cleanStr);
    return isNaN(num) ? 0 : num;
  }

  function handleFormattedInput(inputElement) {
    let rawValue = inputElement.value.replace(/[^0-9.]/g, '');
    
    if (rawValue) {
      const parts = rawValue.split('.');
      parts[0] = parseInt(parts[0], 10).toLocaleString('ko-KR');
      inputElement.value = parts.join('.');
    } else {
      inputElement.value = '';
    }
    
    calculate();
  }

  function calculate() {
    const targetScore = parseRawNumber(document.getElementById('targetScore').value);
    const pvInputs = document.querySelectorAll('.pv');
    const fqInputs = document.querySelectorAll('.fq');

    let totalPV = 0;
    let totalFQ = 0;
    let filledMonths = 0;

    pvInputs.forEach((input, index) => {
      const pvVal = input.value.trim();
      const fqVal = fqInputs[index].value.trim();

      if (pvVal !== '') {
        totalPV += parseRawNumber(pvVal);
        filledMonths++;
      }
      if (fqVal !== '' && !isNaN(fqVal)) {
        totalFQ += parseFloat(fqVal);
      }
    });

    const currentScore = totalPV + (totalFQ * 1000);
    const remainingMonths = 12 - filledMonths;

    let reqMonthlyPv = 0;
    if (targetScore > currentScore && remainingMonths > 0) {
      reqMonthlyPv = (targetScore - currentScore) / remainingMonths;
    }

    document.getElementById('currentScore').innerText = currentScore.toLocaleString('ko-KR');
    document.getElementById('remMonths').innerText = remainingMonths;
    document.getElementById('reqMonthlyPv').innerText = reqMonthlyPv > 0 ? reqMonthlyPv.toLocaleString('ko-KR', {maximumFractionDigits: 1}) : 0;
  }

  function resetForm() {
    document.querySelectorAll('input').forEach(i => i.value = '');
    calculate();
  }
</script>

</body>
</html>
